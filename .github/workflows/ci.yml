name: CI - pruebas, calidad y Docker

on:
  push:
    branches: [main, developer]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pruebas-y-sonarcloud:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # SonarCloud necesita el historial completo

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Estilo (flake8)
        run: |
          mkdir -p reports
          flake8 mlops_pipeline tests --tee --output-file=reports/flake8.txt

      - name: Pruebas con cobertura
        run: pytest --cov=mlops_pipeline --cov-report=xml:coverage.xml --cov-report=term --junitxml=reports/pytest.xml

      - name: Análisis en SonarCloud
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    needs: pruebas-y-sonarcloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Construir imagen
        run: docker build -t credito-ml:ci .

      - name: Prueba de humo del contenedor
        run: |
          docker run -d --name api -p 8000:8000 credito-ml:ci
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 2; done
          curl -sf http://localhost:8000/health | grep '"modelo_cargado":true'
          docker logs api
          docker rm -f api
