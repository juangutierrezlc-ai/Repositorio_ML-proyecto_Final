# Configuración del análisis en SonarCloud (https://sonarcloud.io)
# Si al importar el repositorio SonarCloud asigna otra clave u organización, cámbialas aquí.
sonar.projectKey=juangutierrezlc-ai_Repositorio_ML-proyecto_Final
sonar.organization=juangutierrezlc-ai
sonar.projectName=Repositorio_ML-proyecto_Final
sonar.projectVersion=1.0

# Código fuente y pruebas
sonar.sources=mlops_pipeline
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.13
# Los notebooks son de exploración (EDA); el análisis se centra en el código del pipeline
sonar.exclusions=**/*.ipynb,**/__pycache__/**

# Cobertura de pruebas, resultados de pytest y estilo (flake8)
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=reports/pytest.xml
sonar.python.flake8.reportPaths=reports/flake8.txt
